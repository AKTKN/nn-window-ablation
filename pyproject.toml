[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-window-ablation"
version = "0.0.0"
description = "Neural surface-code window-decoding ablations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["hydra-core==1.3.2", "omegaconf==2.3.0"]

[project.scripts]
nnwa = "nn_window_ablation.cli:main"

# Candidate versions, not a tested environment lock.
# Install torch from its official CPU index first; see environments/README.md.
[project.optional-dependencies]
experiment = [
  "torch==2.7.0",
  "torch-geometric==2.6.1",
  "stim==1.15.0",
  "pymatching==2.2.2",
  "numpy==2.2.6",
  "scipy>=1.15,<2",
  "matplotlib==3.10.3",
]
dev = ["pytest>=8,<9", "pytest-xdist>=3.6,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nn_window_ablation = ["conf/*.yaml", "conf/*/*.yaml", "conf/README.md", "LANGE_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "performance: measures runtime or deliberately uses multiple numerical threads or loader workers",
  "cluster: requires an allocated cluster node or scheduler access",
]
