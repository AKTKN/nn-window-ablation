[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-window-ablation"
version = "0.0.0"
description = "Preimplementation scaffold for neural surface-code window-decoding ablations"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

# Candidate versions, not a tested environment lock.
# Install torch from its official CPU index first; see environments/README.md.
[project.optional-dependencies]
experiment = [
  "torch==2.7.0",
  "torch-geometric==2.6.1",
  "stim==1.15.0",
  "pymatching==2.2.2",
  "numpy==2.2.6",
  "scipy>=1.15,<2",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "matplotlib==3.10.3",
]
dev = ["pytest>=8,<9"]

# No [project.scripts] entry until the CLI is implemented in P0.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nn_window_ablation = ["conf/*.yaml", "conf/*/*.yaml", "conf/README.md"]
